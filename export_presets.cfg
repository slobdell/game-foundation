; Export presets: how `make export-web` and `make export-desktop` package the game (_agents/sharing.md).
; Godot rewrites this file when you change an export setting in the editor; that's fine, keep the comments' advice.
;
; include_filter: Godot packs only resources it knows (scenes, scripts, imported art and sound). Plain JSON files the
; game reads at run time must be listed here or the exported game cannot find them (it works in the editor, then
; breaks in the browser). Add a line when the game starts reading a new kind of file.
; exclude_filter: the workshop (docs, tests, tools, the asset pipeline, review images, audio masters) stays out of
; the pack, so the download is small.

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/dialogue/*.json, assets/audio/*.json, assets/music/*.json, assets/models/*.json"
exclude_filter="_agents/*, tests/*, build/*, tools/*, assets/pipeline/*, assets/review/*, assets/audio/masters/*, assets/music/masters/*, game/kit/audio/fixtures/*"
export_path="build/web/index.html"

[preset.0.options]

; Single-threaded build: no SharedArrayBuffer, so ANY static host (GitHub Pages, itch.io) works without special
; COOP/COEP headers. Only the no-threads web templates are installed by `make bootstrap`.
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]

name="Linux Desktop"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/dialogue/*.json, assets/audio/*.json, assets/music/*.json, assets/models/*.json"
exclude_filter="_agents/*, tests/*, build/*, tools/*, assets/pipeline/*, assets/review/*, assets/audio/masters/*, assets/music/masters/*, game/kit/audio/fixtures/*"
export_path="build/desktop/game.x86_64"

[preset.1.options]

; One file to share: the game's data is packed inside the program.
binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.2]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/dialogue/*.json, assets/audio/*.json, assets/music/*.json, assets/models/*.json"
exclude_filter="_agents/*, tests/*, build/*, tools/*, assets/pipeline/*, assets/review/*, assets/audio/masters/*, assets/music/masters/*, game/kit/audio/fixtures/*"
export_path="build/desktop/game-macos.zip"

[preset.2.options]

; A .zip holding the .app, for Apple Silicon and Intel Macs. Signed "ad-hoc" (enough for it to run on the Mac
; that built it, or on another Mac after right-click > Open once); NOT notarized: that needs a paid Apple developer
; account, which this project doesn't assume. `make export-desktop` picks this preset on a Mac.
binary_format/architecture="universal"
application/bundle_identifier="org.gamefoundation.game"
application/short_version="1.0"
application/version="1"
codesign/codesign=1
notarization/notarization=0
